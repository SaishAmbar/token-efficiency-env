[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-token_efficiency_env"
version = "0.1.0"
description = "Token Efficiency Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    "openenv-core[core]>=0.2.2",
    # Tokenizer for counting answer tokens (Qwen2.5-3B-Instruct)
    "transformers>=4.44.0",
    "tokenizers>=0.20.0",
    # LLM judge for the correctness component of the reward.
    # Uses huggingface_hub.InferenceClient against the Inference Providers
    # router. Default model: meta-llama/Llama-3.2-3B-Instruct.
    "huggingface_hub>=0.26.0",
    # Pydantic for action/observation models. Already a transitive dep of
    # openenv-core, declared explicitly here for clarity.
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m token_efficiency_env.server.app
server = "token_efficiency_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["token_efficiency_env", "token_efficiency_env.server"]
package-dir = { "token_efficiency_env" = ".", "token_efficiency_env.server" = "server" }